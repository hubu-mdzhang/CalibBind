# ============================================================================
# 遥感算子波段匹配实验 —— 配置文件
#
# 用法：编辑本文件填入实际值，然后直接运行 python 脚本，无需命令行输入 Key。
# 本文件含敏感信息，已加入 .gitignore，切勿提交到公开仓库。
# ============================================================================

[llm]
# ---- DeepSeek（推荐，国内直连）----
base_url = https://api.deepseek.com/v1
api_key = sk-xxxxxxxxxxxxxxxxxxxxxxxx
model = deepseek-chat

# ---- 通义千问 / 阿里云百炼（OpenAI 兼容模式）----
# base_url = https://dashscope.aliyuncs.com/compatible-mode/v1
# api_key = 在这里填 DashScope 的 API Key
# model = qwen-plus

# ---- 智谱 GLM ----
# base_url = https://open.bigmodel.cn/api/paas/v4
# api_key = 在这里填 GLM 的 API Key
# model = glm-4-plus

# ---- 本地 Ollama（无需 Key）----
# base_url = http://localhost:11434/v1
# api_key = ollama
# model = qwen2.5:7b

# ---- 自建 vLLM / LM Studio ----
# base_url = http://localhost:8000/v1
# api_key = EMPTY
# model = 你的模型名


[experiment]
# 是否跑「含波长」消融模式，用于输入信息消融对比
# true  = 两种都跑（仅波段标签 / 含波长范围）
# false = 只跑仅波段标签
run_with_wavelength = true

# 采样温度。波段匹配是确定性任务，建议保持 0.0
temperature = 0.0

# 单次请求最大 token 数
max_tokens = 800

# 失败重试次数（应对 429 限流）
retries = 3

# 单次请求超时（秒）
timeout = 60

# 两次请求间隔（秒），避免触发频率限制
request_interval = 0.3


[jev]
# ============ Jev 决策模型（TypeSafe System One）============
# 用途：四范式对比的基线 D，把波段匹配建模为 Choice 任务。
#
# ---- 端点（三选一，请求体结构完全一致）----
#  A. OpenRouter Decisions API（推荐，无需 TypeSafe/DO 账号）
#       https://openrouter.ai/api/alpha/decisions
#       模型 ID 需带 typesafe/ 前缀，如 typesafe/jev-1.13
#  B. OpenRouter System One API（若用 TypeSafe SDK 指向 OpenRouter）
#       https://openrouter.ai/api/v1/systemone
#  C. DigitalOcean 托管
#       https://inference.do-ai.run/v1/systemone
#       模型 ID 不用前缀：typesafe-jev-1.13.0
#     注：TypeSafe 官方端点 api.typesafe.ai 国内返回 451，不可用。
base_url = https://openrouter.ai/api/alpha/decisions

# API Key。OpenRouter 用 sk-or-v1- 开头的 Key；
# 若换回 DigitalOcean 则填 MODEL_ACCESS_KEY。
api_key = sk-xxxxxxxxxxxxxxxxxxxxxxxx

# 模型 ID。注意 OpenRouter 需带 typesafe/ 前缀，
#脚本会自动补全裸名（jev-1.13 -> typesafe/jev-1.13）
model = typesafe/jev-1.13

# 单次请求超时（秒）。Jev 官方称延迟 70~500ms，留足余量。
timeout = 30

# 失败重试次数
retries = 3

# 两次请求间隔（秒）
request_interval = 0.2

# 置信阈值：>high 直接采信，mid~high 人工复核，<mid 回退规则库
conf_high = 0.80
conf_low = 0.60

# 是否在 state 中附带真实波长（true=给物理先验，false=纯语义冷启动）
with_wavelength = true


[rag]
# ============ 向量服务（推荐：走服务器 Ollama）============
# 在服务器上已装 bge-m3（1024 维）等 embedding 模型时，
# 填服务器地址即可，无需本地下载模型权重。
# 留空则自动回退到本地 sentence-transformers，再不行用离线哈希向量。
ollama_base_url = http://<your-ollama-host>:<port>

# embedding 模型名。留空则自动从服务器模型列表里挑一个含 embed/bge 的。
# 服务器现有可用：bge-m3:latest、qllama/bge-m3:q4_k_m、nomic-embed-text:latest
ollama_embedding_model = bge-m3:latest

# 本地回退模型（仅当上面地址不可用时才用）
# 国内直连 HuggingFace 通常不通，需先设 HF_ENDPOINT=https://hf-mirror.com
embedding_model = BAAI/bge-small-zh-v1.5

# 检索 Top-K（用于统计 Top-3 召回率）
top_k = 3

# 候选波段数上限，避免高光谱产品（如 32 波段）候选爆炸
max_candidates = 40


[platform]
# ============ OGE 开放地球引擎平台 ============
base_url = https://openge.org.cn/api

# ---- 登录凭据 ----
# 实测：公开的产品/算子查询接口免鉴权，不带凭据即可拉到全部
# 489 个算子与 96 个产品，故留空也能完成数据集构建。
# 需要凭据的场景：访问私有算子/自有产品、调用算子执行接口、提高频率配额。
username =
password =
access_token =

# 采集请求间隔（秒），避免给平台造成压力
request_interval = 0.03

# 失败重试次数与超时（秒）
retries = 3
timeout = 30


[output]
# Excel 输出文件名
excel_name = 算子波段匹配矩阵.xlsx

# LLM 原始结果文件名前缀
llm_result_prefix = llm_results
